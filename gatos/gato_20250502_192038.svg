<svg width='200' height='200' viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'>
  <!-- Cuerpo del gato -->
  <circle cx='100' cy='120' r='50' fill='#FFD700' stroke='#000' stroke-width='2'/>
  
  <!-- Cabeza del gato -->
  <circle cx='100' cy='60' r='40' fill='#FFD700' stroke='#000' stroke-width='2'/>
  
  <!-- Orejas del gato -->
  <polygon points='60,30 80,10 100,30' fill='#FFD700' stroke='#000' stroke-width='2'/>
  <polygon points='140,30 120,10 100,30' fill='#FFD700' stroke='#000' stroke-width='2'/>
  
  <!-- Ojos -->
  <circle cx='80' cy='50' r='5' fill='#000'/>
  <circle cx='120' cy='50' r='5' fill='#000'/>
  
  <!-- Nariz y boca -->
  <polygon points='100,65 95,75 105,75' fill='#FF6B6B'/>
  <path d='M95 80 Q100 85 105 80' stroke='#000' fill='none' stroke-width='1'/>
  
  <!-- Bigotes -->
  <line x1='85' y1='70' x2='60' y2='65' stroke='#000' stroke-width='1'/>
  <line x1='85' y1='75' x2='60' y2='75' stroke='#000' stroke-width='1'/>
  <line x1='85' y1='80' x2='60' y2='85' stroke='#000' stroke-width='1'/>
  <line x1='115' y1='70' x2='140' y2='65' stroke='#000' stroke-width='1'/>
  <line x1='115' y1='75' x2='140' y2='75' stroke='#000' stroke-width='1'/>
  <line x1='115' y1='80' x2='140' y2='85' stroke='#000' stroke-width='1'/>
  
  <!-- Patas (estilo pollito) -->
  <rect x='85' y='160' width='10' height='20' fill='#FFD700' stroke='#000' stroke-width='1'/>
  <rect x='105' y='160' width='10' height='20' fill='#FFD700' stroke='#000' stroke-width='1'/>
  
  <!-- Cola -->
  <path d='M150 120 Q170 100 150 80' stroke='#000' fill='none' stroke-width='2'/>
</svg>