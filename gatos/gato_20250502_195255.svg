<svg width='200' height='200' viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'>
  <!-- Cuerpo de gato -->
  <ellipse cx='100' cy='120' rx='60' ry='40' fill='#f9a825' />
  
  <!-- Cabeza de gato -->
  <circle cx='100' cy='60' r='40' fill='#f9a825' />
  
  <!-- Orejas de gato -->
  <polygon points='70,30 60,60 80,50' fill='#f9a825' />
  <polygon points='130,30 140,60 120,50' fill='#f9a825' />
  
  <!-- Ojos filosóficos -->
  <circle cx='80' cy='50' r='8' fill='#333' />
  <circle cx='120' cy='50' r='8' fill='#333' />
  
  <!-- Bigotes -->
  <line x1='90' y1='70' x2='60' y2='80' stroke='#333' stroke-width='2' />
  <line x1='90' y1='75' x2='60' y2='75' stroke='#333' stroke-width='2' />
  <line x1='90' y1='80' x2='60' y2='70' stroke='#333' stroke-width='2' />
  <line x1='110' y1='70' x2='140' y2='80' stroke='#333' stroke-width='2' />
  <line x1='110' y1='75' x2='140' y2='75' stroke='#333' stroke-width='2' />
  <line x1='110' y1='80' x2='140' y2='70' stroke='#333' stroke-width='2' />
  
  <!-- Boca de pollito (pico) -->
  <polygon points='95,85 105,85 100,95' fill='#ff7043' />
  
  <!-- Patas de pollito (interpretación abstracta) -->
  <rect x='80' y='150' width='10' height='20' fill='#f9a825' />
  <rect x='110' y='150' width='10' height='20' fill='#f9a825' />
  
  <!-- Cola de dinosaurio -->
  <path d='M160,120 Q180,100 170,80 Q160,60 140,70' fill='none' stroke='#f9a825' stroke-width='8' />
  
  <!-- Expresión filosófica -->
  <text x='50' y='190' font-family='Arial' font-size='12' fill='#333'>¿Y si los gatos son pollitos?</text>
</svg>